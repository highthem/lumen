<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Loop · Lumen Morning</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #050403; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  #root { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="animations.jsx"></script>
<script type="text/babel" src="scene-helpers.jsx"></script>
<script type="text/babel" src="loops.jsx"></script>

<script type="text/babel">
const params = new URLSearchParams(location.search);
const which = params.get('loop') || 'title';
const showChrome = params.get('chrome') !== '0';
const loops = {
  title:    { Comp: LoopKineticTitle, dur: 6,  label: 'Kinetic title' },
  ambient:  { Comp: LoopAmbient,      dur: 14, label: 'Ambient' },
  sunrise:  { Comp: LoopSunriseAlarm, dur: 8,  label: 'Sunrise alarm' },
  voice:    { Comp: LoopVoice,        dur: 6,  label: 'Voice transcription' },
  deck:     { Comp: LoopCardDeck,     dur: 7,  label: 'Card deck Q2' },
  breath:   { Comp: LoopBreathing,    dur: 8,  label: 'Breathing timer' },
  synth:    { Comp: LoopSynthesis,    dur: 7,  label: 'Synthesis reveal' },
};
const cfg = loops[which] || loops.title;
document.title = `Loop · ${cfg.label}`;

function App() {
  return (
    <Stage width={1920} height={1080} duration={cfg.dur} background="#0F0D0B" persistKey={`lumen:loop:${which}`} loop={true} chrome={showChrome}>
      <cfg.Comp />
    </Stage>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
