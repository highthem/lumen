appId: com.highthem.lumen
tags: [edge, permissions, voice]
---
- launchApp:
    clearState: true
    arguments:
      isMaestro: "true"

- openLink: "lumen://ritual/q3?mic=denied"
- runFlow: ../_shared/confirm-ios-open-lumen.yaml

- tapOn:
    id: "mic-button"

# Lumen falls back to typing without error
- assertNotVisible:
    text: "Erreur"
- assertVisible:
    id: "gratitude-textarea"
