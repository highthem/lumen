appId: com.highthem.lumen
tags: [edge, a11y, motion]
---
- launchApp:
    clearState: true
    arguments:
      isMaestro: "true"
      reduceMotion: "true"
- openLink: "lumen://ritual/timer"
- runFlow: ../_shared/confirm-ios-open-lumen.yaml

# Cercle respiration doit être statique
- assertVisible:
    id: "presence-circle"
- assertNotVisible:
    id: "presence-circle-animated"
