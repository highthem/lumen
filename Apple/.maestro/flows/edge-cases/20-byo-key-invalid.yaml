appId: com.highthem.lumen
tags: [edge, byo, error]
---
- launchApp:
    clearState: true
    arguments:
      isMaestro: "true"

- openLink: "lumen://test/dashboard?state=ritual"
- runFlow: ../_shared/confirm-ios-open-lumen.yaml
- tapOn: "Réglages"
- scrollUntilVisible:
    element: "Mode avancé"
- tapOn: "Mode avancé"

- tapOn:
    id: "provider-openai"
- tapOn:
    id: "api-key-input"
- inputText: "definitely-not-a-valid-key"
- tapOn:
    id: "test-key-button"

# Error state
- extendedWaitUntil:
    visible: "Clé invalide"
    timeout: 8000

# Save button disabled
- assertVisible:
    id: "save-button-disabled"
