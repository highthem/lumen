appId: com.highthem.lumen
tags: [edge, byo, error]
---
- launchApp:
    clearState: true
    arguments:
      isMaestro: "true"

- openLink: "lumen://test/dashboard?state=ritual"
- runFlow: ../_shared/confirm-ios-open-lumen.yaml
- openLink: "lumen://test/settings"
- runFlow: ../_shared/confirm-ios-open-lumen.yaml
- scrollUntilVisible:
    element:
      id: "settings-advanced-link"
- tapOn:
    id: "settings-advanced-link"

- tapOn:
    id: "provider-openai"
- tapOn:
    id: "api-key-input"
- inputText: "definitely-not-a-valid-key"
- tapOn:
    id: "test-key-button"

# Error state
- extendedWaitUntil:
    visible: "Format invalide."
    timeout: 8000

# Save button disabled
- assertVisible:
    id: "save-button-disabled"
