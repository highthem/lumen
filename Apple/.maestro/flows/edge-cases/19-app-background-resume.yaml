appId: com.highthem.lumen
tags: [edge, lifecycle]
---
- launchApp:
    clearState: true
    arguments:
      isMaestro: "true"
- openLink: "lumen://ritual/q2"
- runFlow: ../_shared/confirm-ios-open-lumen.yaml

- assertVisible: "Qu'est-ce qui compte"

# Background l'app
- pressKey: Home

- waitForAnimationToEnd:
    timeout: 2000

# Reopen
- launchApp:
    stopApp: false

# Should resume on the same ritual step
- extendedWaitUntil:
    visible: "Qu'est-ce qui compte"
    timeout: 3000
