appId: com.highthem.lumen
tags: [regression, settings, audio]
---
- launchApp:
    clearState: true
    arguments:
      isMaestro: "true"

- openLink: "lumen://test/dashboard?state=alarm"
- runFlow: ../_shared/confirm-ios-open-lumen.yaml
- tapOn: "Réveil"
- tapOn:
    id: "alarm-row-07:00"

# 5 alarmes disponibles
- assertVisible: "Aube"
- assertVisible: "Bois"
- assertVisible: "Marée"
- assertVisible: "Cloche"
- assertVisible: "Souffle"

# Preview au tap
- tapOn: "Bois"
- extendedWaitUntil:
    visible:
      id: "sound-preview-playing"
    timeout: 2000
- tapOn: "Bois"   # 2nd tap = stop preview

# Save selection
- tapOn:
    id: "alarm-save-button"
- assertVisible:
    text: "Bois"
