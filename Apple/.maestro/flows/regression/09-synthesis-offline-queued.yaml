appId: com.highthem.lumen
tags: [regression, offline, queue]
---
- launchApp:
    clearState: true
    arguments:
      isMaestro: "true"

- openLink: "lumen://test/synthesis?state=queued"
- runFlow: ../_shared/confirm-ios-open-lumen.yaml

# Expect Queued state (no Apple Intelligence on simulator)
- assertVisible: "Ta synthèse arrive"
- assertVisible: "On te notifie dès que ton réseau revient."
- tapOn:
    id: "synthesis-continue-button"
