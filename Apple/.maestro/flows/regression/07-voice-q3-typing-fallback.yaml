appId: com.highthem.lumen
tags: [regression, voice, fallback]
env:
  RITUAL_DEEPLINK: "lumen://ritual/q3"
---
- launchApp:
    clearState: true
    arguments:
      isMaestro: "true"

- openLink: ${RITUAL_DEEPLINK}
- runFlow: ../_shared/confirm-ios-open-lumen.yaml

# Q3 voice par défaut → tap "Écrire au clavier"
- assertVisible:
    id: "priority-mic"
- tapOn:
    id: "priority-keyboard-toggle"
- assertVisible:
    id: "priority-textarea"

# Verify retour à la voix
- tapOn:
    id: "priority-return-to-voice"
- assertVisible:
    id: "priority-mic"
