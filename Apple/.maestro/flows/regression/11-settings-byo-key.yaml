appId: com.highthem.lumen
tags: [regression, settings, byo]
---
- launchApp:
    clearState: true
    arguments:
      isMaestro: "true"

- openLink: "lumen://test/dashboard?state=ritual"
- runFlow: ../_shared/confirm-ios-open-lumen.yaml
- tapOn: "Réglages"
- scrollUntilVisible:
    element: "Mode avancé"
- tapOn: "Mode avancé"

# BYO API key flow
- tapOn:
    id: "provider-anthropic"
- tapOn:
    id: "api-key-input"
- inputText: "sk-ant-fake-test-key-not-real"
- tapOn:
    id: "test-key-button"

# Test should fail (fake key)
- extendedWaitUntil:
    visible: "Clé invalide"
    timeout: 8000

# Test with valid placeholder (env-injected during test)
- tapOn:
    id: "api-key-input"
- eraseText: 50
- inputText: "sk-ant-valid-maestro-key"
- tapOn:
    id: "test-key-button"
- extendedWaitUntil:
    visible: "Clé valide"
    timeout: 8000

- tapOn:
    id: "save-key-button"
- assertVisible: "Clé personnelle"
