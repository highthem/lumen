appId: com.highthem.lumen
tags: [regression, settings, byo]
---
- launchApp:
    clearState: true
    arguments:
      isMaestro: "true"

- openLink: "lumen://test/dashboard?state=ritual"
- runFlow: ../_shared/confirm-ios-open-lumen.yaml
- openLink: "lumen://test/settings"
- runFlow: ../_shared/confirm-ios-open-lumen.yaml
- scrollUntilVisible:
    element:
      id: "settings-advanced-link"
- tapOn:
    id: "settings-advanced-link"

# BYO API key flow
- tapOn:
    id: "provider-anthropic"
- tapOn:
    id: "api-key-input"
- inputText: "sk-ant-fake-test-key-not-real"
- tapOn:
    id: "test-key-button"

# Test should fail (fake key)
- extendedWaitUntil:
    visible:
      id: "api-key-status-invalid"
    timeout: 8000

# Test with valid placeholder (env-injected during test)
- tapOn:
    id: "api-key-input"
- eraseText: 50
- inputText: "sk-ant-valid-maestro-key"
- tapOn:
    id: "test-key-button"
- extendedWaitUntil:
    visible:
      id: "api-key-status-valid"
    timeout: 8000

- tapOn:
    id: "save-key-button"
- assertVisible:
    id: "api-key-status-saved"
