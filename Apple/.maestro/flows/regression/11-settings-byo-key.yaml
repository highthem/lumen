appId: com.highthem.lumen
tags: [regression, settings, byo]
---
- launchApp:
    clearState: false

- tapOn:
    id: "settings-button"
- scrollUntilVisible:
    element: "Mode avancé"
- tapOn: "Mode avancé"

# BYO API key flow
- tapOn:
    id: "provider-anthropic"
- tapOn:
    id: "api-key-input"
- inputText: "sk-ant-fake-test-key-not-real"
- tapOn: "Tester la clé"

# Test should fail (fake key)
- extendedWaitUntil:
    visible: "Clé invalide"
    timeout: 8000

# Test with valid placeholder (env-injected during test)
- tapOn:
    id: "api-key-input"
- eraseText: 50
- inputText: ${MAESTRO_TEST_ANTHROPIC_KEY}
- tapOn: "Tester la clé"
- extendedWaitUntil:
    visible: "Clé valide"
    timeout: 8000

- tapOn: "Enregistrer"
- assertVisible: "Clé personnelle"
