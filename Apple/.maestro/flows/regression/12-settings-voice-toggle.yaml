appId: com.highthem.lumen
tags: [regression, settings, voice]
---
- launchApp:
    clearState: true
    arguments:
      isMaestro: "true"

- openLink: "lumen://test/dashboard?state=ritual"
- runFlow: ../_shared/confirm-ios-open-lumen.yaml
- openLink: "lumen://test/settings"
- runFlow: ../_shared/confirm-ios-open-lumen.yaml
- scrollUntilVisible:
    element:
      id: "voice-default-toggle"
- tapOn: "Mode vocal par défaut"

# Verify Q3 default = typing (after toggle off)
- openLink: "lumen://ritual/q3?voice=keyboard"
- runFlow: ../_shared/confirm-ios-open-lumen.yaml
- assertVisible:
    id: "priority-textarea"   # typing par défaut maintenant
- assertNotVisible:
    id: "priority-mic"   # micro masqué
