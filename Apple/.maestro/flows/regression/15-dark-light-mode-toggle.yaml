appId: com.highthem.lumen
tags: [regression, settings, appearance]
---
- launchApp:
    clearState: true
    arguments:
      isMaestro: "true"

- openLink: "lumen://test/dashboard?state=ritual"
- runFlow: ../_shared/confirm-ios-open-lumen.yaml
- tapOn: "Réglages"
- tapOn:
    id: "appearance-picker"

# Test all 3 modes
- tapOn: "Sombre"
- takeScreenshot: theme-dark
- assertVisible:
    id: "settings-screen"

- tapOn:
    id: "appearance-picker"
- tapOn: "Clair"
- takeScreenshot: theme-light

- tapOn:
    id: "appearance-picker"
- tapOn: "Système"
- assertVisible: "Système"
