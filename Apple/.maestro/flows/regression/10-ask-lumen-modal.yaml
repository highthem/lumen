appId: com.highthem.lumen
tags: [regression, ai, ask-lumen]
---
- launchApp:
    clearState: true
    arguments:
      isMaestro: "true"

- openLink: "lumen://test/dashboard?state=ritual"
- runFlow: ../_shared/confirm-ios-open-lumen.yaml
- assertVisible:
    id: "dashboard-screen"
- tapOn: "Ask Lumen"

- assertVisible: "Ask Lumen"
- tapOn:
    id: "ask-lumen-input"
- inputText: "Comment garder l'énergie ?"
- tapOn:
    id: "ask-lumen-send"

- extendedWaitUntil:
    visible:
      id: "ask-lumen-response"
    timeout: 8000

- tapOn: "Fermer"
- assertVisible:
    id: "dashboard-screen"
