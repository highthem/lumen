appId: com.highthem.lumen
tags: [regression, rate-limit]
env:
  # State seed: 3 synthèses déjà faites today
  SEED_RATE_LIMIT_HIT: "true"
---
- launchApp:
    clearState: true
    arguments:
      isMaestro: "true"

- openLink: "lumen://test/synthesis?state=rateLimited"
- runFlow: ../_shared/confirm-ios-open-lumen.yaml

# Expected rate limit
- assertVisible:
    id: "synthesis-rate-limit-message"
- tapOn: "Continuer vers le dashboard"
- assertVisible:
    id: "dashboard-screen"
