appId: com.highthem.lumen
name: Create Alarm
tags: 
  - smoke 
  - alarm
---
- launchApp:
    clearState: true
    arguments:
      isMaestro: "true"
- runFlow: ../_shared/confirm-ios-open-lumen.yaml

- openLink: "lumen://test/dashboard?state=empty"
- runFlow: ../_shared/confirm-ios-open-lumen.yaml

# Depuis dashboard, ouvre alarmes
- tapOn: "Réveil"
- tapOn:
    id: "alarm-add-button"

# Form
- tapOn:
    id: "alarm-time-picker"
- inputText: "0700"
- tapOn:
    id: "recurrence-weekdays"
- tapOn:
    id: "alarm-sound-alarm-aube"
- tapOn:
    id: "alarm-save-button"

# Verify
- assertVisible:
    id: "alarm-row-07:00"
