appId: com.highthem.lumen
name: Settings Export JSON
tags: 
  - smoke 
  - settings
  - ethics
---
- launchApp:
    clearState: true
    arguments:
      isMaestro: "true"
- runFlow: ../_shared/confirm-ios-open-lumen.yaml

- openLink: "lumen://test/dashboard?state=ritual"
- runFlow: ../_shared/confirm-ios-open-lumen.yaml
- tapOn: "Réglages"

# Scroll to ethical monitoring section
- scrollUntilVisible:
    element: "Exporter en JSON"

- tapOn:
    id: "export-json-button"

# ShareSheet expected
- extendedWaitUntil:
    visible: "Lumen-ethical-export"
    timeout: 5000

# Dismiss share sheet
- tapOn: "Cancel"
