appId: com.highthem.lumen
name: Settings Export JSON
tags: 
  - smoke 
  - settings
  - ethics
---
- launchApp:
    clearState: true
    arguments:
      isMaestro: "true"
- runFlow: ../_shared/confirm-ios-open-lumen.yaml

- openLink: "lumen://test/dashboard?state=ritual"
- runFlow: ../_shared/confirm-ios-open-lumen.yaml
- openLink: "lumen://test/settings"
- runFlow: ../_shared/confirm-ios-open-lumen.yaml

# Scroll to ethical monitoring section
- scrollUntilVisible:
    element:
      id: "export-json-button"

- tapOn:
    id: "export-json-button"

# ShareSheet expected
- extendedWaitUntil:
    visible: "Copy"
    timeout: 5000

# Dismiss share sheet
- tapOn:
    point: "90%, 15%"
