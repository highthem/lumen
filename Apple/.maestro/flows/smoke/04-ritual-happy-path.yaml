appId: com.highthem.lumen
name: Ritual Happy Path
tags:
  - smoke
  - ritual
env:
  RITUAL_DEEPLINK: "lumen://ritual/start"
---
- launchApp:
    clearState: true
    arguments:
      isMaestro: "true"
- runFlow: ../_shared/confirm-ios-open-lumen.yaml

# Trigger ritual via deep link (skip the real alarm)
- openLink: ${RITUAL_DEEPLINK}
- runFlow: ../_shared/confirm-ios-open-lumen.yaml

# Timer présence (60s par défaut, on skip pour le test)
- assertVisible:
    id: "presence-timer-screen"
- tapOn: "Passer →"

# Q1 Mood — tap centre to advance.
# Q1 uses ChromaticSlider with `.accessibilityRepresentation { Slider(...) }`,
# which replaces the entire accessibility tree with a single Slider node,
# making text/dots invisible to Maestro queries. Tap-to-advance works because
# the parent has a simultaneousGesture { onNext() } covering the whole screen.
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    point: "50%, 50%"

# Q2 Energy — V11 breathing-orb + slider. Slider has a default of "moyen"
# (level 2) and "Suivant" is always enabled, so the smoke flow just advances
# without touching the slider. Visual layout is verified by manual e2e.
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: "energy-orb"
    timeout: 8000
- tapOn: "Suivant"

# Q3 Priority — V11 voice-first. Maestro can't drive the mic, so use the
# keyboard fallback (mirrors the Q4 pattern).
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: "priority-keyboard-toggle"
    timeout: 8000
- tapOn:
    id: "priority-keyboard-toggle"
- inputText: "Bloquer 90 minutes pour le brief."
- tapOn:
    id: "priority-return-to-voice"
- tapOn: "Suivant"

# Q4 Gratitude — fallback typing (Maestro can't mic)
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: "gratitude-keyboard-toggle"
    timeout: 8000
- tapOn:
    id: "gratitude-keyboard-toggle"
- inputText: "Le silence avant que les enfants se lèvent."
- tapOn:
    id: "gratitude-return-to-voice"
- tapOn: "Voir ma synthèse"

# Synthesis screen
- extendedWaitUntil:
    visible:
      id: "synthesis-screen"
    timeout: 8000   # cloud AI call
- assertVisible:
    id: "synthesis-listen-button"
- tapOn:
    id: "synthesis-continue-button"

# Dashboard post-rituel — id-based assertions (text matching is unreliable
# with French diacritics + custom fonts in Maestro 2.5.1)
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: "dashboard-screen"
    timeout: 8000
- assertVisible:
    id: "dashboard-card-mood"
- assertVisible:
    id: "dashboard-card-energy"
- assertVisible:
    id: "dashboard-card-priority"
- assertVisible:
    id: "dashboard-card-gratitude"
- assertVisible:
    id: "dashboard-card-presence"
- assertVisible:
    id: "dashboard-card-sleep"
