<!doctype html>
<html lang="fr">

<title>Lumen — Étape 3 · Maquettes</title>
<link rel="stylesheet" href="screens/styles.css">
<style>

</style>

<body>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="screens/screens.jsx"></script>
<script type="text/babel" src="screens/screens-v2.jsx"></script>
<script type="text/babel" src="screens/screens-v3.jsx"></script>
<script type="text/babel" src="screens/screens-v4.jsx"></script>

<script type="text/babel">
function App() {

        <DCArtboard id="ob-perm-l" label="03 · Permissions — light" width={390} height={844}><OnboardingPermissions mode="lite" /></DCArtboard>

        <DCArtboard id="ob-alarm-l" label="04 · Première alarme — light" width={390} height={844}><OnboardingAlarm mode="lite" /></DCArtboard>

        <DCArtboard id="dash-idle-l" label="Idle — light" width={390} height={844}><DashboardIdle mode="lite" /></DCArtboard>

        <DCArtboard id="alarm-edit-l" label="Édition — light" width={390} height={844}><AlarmEdit mode="lite" /></DCArtboard>

        <DCArtboard id="synth-cloud-l" label="Cloud — light" width={390} height={844}><Synthesis mode="lite" offline={false} /></DCArtboard>

        <DCArtboard id="set-l" label="Settings — light" width={390} height={844}><Settings mode="lite" /></DCArtboard>

        <DCArtboard id="syn-pl-d" label="Cloud · Listen playing — dark" width={390} height={844}><SynthesisV2Cloud mode="dark" playing={true} /></DCArtboard>
        <DCArtboard id="syn-pl-l" label="Cloud · Listen playing — light" width={390} height={844}><SynthesisV2Cloud mode="lite" playing={true} /></DCArtboard>

        <DCArtboard id="syn-ai-l" label="Apple Intelligence — light" width={390} height={844}><SynthesisV2AppleIntel mode="lite" /></DCArtboard>

        <DCArtboard id="set2-l" label="Settings V2 — light" width={390} height={844}><SettingsV2 mode="lite" /></DCArtboard>

        <DCArtboard id="q3v3-def-l" label="Q3 · Default — light" width={390} height={844}><Q3VoiceV3 mode="lite" state="default" /></DCArtboard>
        <DCArtboard id="q3v3-lis-d" label="Q3 · Listening — dark" width={390} height={844}><Q3VoiceV3 mode="dark" state="listening" /></DCArtboard>
        <DCArtboard id="q3v3-lis-l" label="Q3 · Listening — light" width={390} height={844}><Q3VoiceV3 mode="lite" state="listening" /></DCArtboard>
        <DCArtboard id="q3v3-tr-d" label="Q3 · Transcribed — dark" width={390} height={844}><Q3VoiceV3 mode="dark" state="transcribed" /></DCArtboard>
        <DCArtboard id="q3v3-tr-l" label="Q3 · Transcribed — light" width={390} height={844}><Q3VoiceV3 mode="lite" state="transcribed" /></DCArtboard>
        <DCArtboard id="q3v3-ed-d" label="Q3 · Editing — dark" width={390} height={844}><Q3VoiceV3 mode="dark" state="editing" /></DCArtboard>
        <DCArtboard id="q3v3-ed-l" label="Q3 · Editing — light" width={390} height={844}><Q3VoiceV3 mode="lite" state="editing" /></DCArtboard>
        <DCArtboard id="q4v3-def-d" label="Q4 · Default — dark" width={390} height={844}><Q4VoiceV3 mode="dark" state="default" /></DCArtboard>
        <DCArtboard id="q4v3-def-l" label="Q4 · Default — light" width={390} height={844}><Q4VoiceV3 mode="lite" state="default" /></DCArtboard>
        <DCArtboard id="q4v3-lis-d" label="Q4 · Listening — dark" width={390} height={844}><Q4VoiceV3 mode="dark" state="listening" /></DCArtboard>
        <DCArtboard id="q4v3-lis-l" label="Q4 · Listening — light" width={390} height={844}><Q4VoiceV3 mode="lite" state="listening" /></DCArtboard>
        <DCArtboard id="q4v3-tr-d" label="Q4 · Transcribed — dark" width={390} height={844}><Q4VoiceV3 mode="dark" state="transcribed" /></DCArtboard>
        <DCArtboard id="q4v3-tr-l" label="Q4 · Transcribed — light" width={390} height={844}><Q4VoiceV3 mode="lite" state="transcribed" /></DCArtboard>
        <DCArtboard id="q4v3-ed-d" label="Q4 · Editing — dark" width={390} height={844}><Q4VoiceV3 mode="dark" state="editing" /></DCArtboard>
        <DCArtboard id="q4v3-ed-l" label="Q4 · Editing — light" width={390} height={844}><Q4VoiceV3 mode="lite" state="editing" /></DCArtboard>
        <DCArtboard id="syn3-idle-d" label="Synthèse · idle — dark" width={390} height={844}><SynthesisV3 mode="dark" playing={false} /></DCArtboard>
        <DCArtboard id="syn3-idle-l" label="Synthèse · idle — light" width={390} height={844}><SynthesisV3 mode="lite" playing={false} /></DCArtboard>
        <DCArtboard id="syn3-pl-d" label="Synthèse · reading focus — dark" width={390} height={844}><SynthesisV3 mode="dark" playing={true} focusBlock={1} /></DCArtboard>
        <DCArtboard id="syn3-pl-l" label="Synthèse · reading focus — light" width={390} height={844}><SynthesisV3 mode="lite" playing={true} focusBlock={1} /></DCArtboard>
      </DCSection>

      <DCSection id="v4-polish" title="V4 · Polish — Q1 Mood (sun rising) + AlarmRinging (aube)" subtitle="2 écrans refaits · 5 disques solaires qui passent l'horizon · gradient d'aube qui monte sur 4s">
        <DCArtboard id="q1v4-d" label="Q1 Mood — sun rising · dark" width={390} height={844}><Q1MoodV4 mode="dark" selected={2} /></DCArtboard>
        <DCArtboard id="q1v4-l" label="Q1 Mood — sun rising · light" width={390} height={844}><Q1MoodV4 mode="lite" selected={2} /></DCArtboard>
        <DCArtboard id="alarm4-d" label="AlarmRinging — aube · dark" width={390} height={844}><AlarmRingingV4 mode="dark" copy={1} /></DCArtboard>
        <DCArtboard id="alarm4-l" label="AlarmRinging — aube · light" width={390} height={844}><AlarmRingingV4 mode="lite" copy={1} /></DCArtboard>

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
